name: Build and test
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build desktop and run tests
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Smoke desktop capture and restoration
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      # Review aid: screenshots of the real UI in both themes. Never a release gate.
      - name: Capture UI screenshots for review
        continue-on-error: true
        shell: powershell
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA 'ClipScope') -ErrorAction SilentlyContinue
          ./scripts/capture-ui-windows.ps1 -OutputDirectory artifacts/ui
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clipscope-ui-screenshots
          path: artifacts/ui
          if-no-files-found: ignore
          retention-days: 14
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ClipScope.Core.Tests --locked-mode
      - run: dotnet restore tests/ClipScope.Infrastructure.Tests --locked-mode
      - run: dotnet test --project tests/ClipScope.Core.Tests -c Release
      - run: dotnet test --project tests/ClipScope.Infrastructure.Tests -c Release
