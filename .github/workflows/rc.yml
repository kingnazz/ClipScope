name: RC installer
on:
  workflow_dispatch:
  push:
    branches: [feat/windows11-rc1]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Version.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/rc.yml'
permissions:
  contents: read
concurrency:
  group: rc-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build, test and package self-contained RC
        id: package
        shell: pwsh
        run: |
          ./scripts/package-rc.ps1
          . ./scripts/rc-version.ps1
          "version=$((Get-ClipScopeVersion).Version)" >> $env:GITHUB_OUTPUT
      - name: Validate installed application and data policy
        shell: pwsh
        run: |
          dotnet restore tools/ClipScope.Diagnostics --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic restore failed' }
          dotnet build tools/ClipScope.Diagnostics -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
          ./scripts/test-installer.ps1
      - name: Upload installer and evidence (no release publishing)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ClipScope-${{ steps.package.outputs.version || 'failed-build' }}-win-x64
          path: |
            artifacts/rc/*-setup.exe
            artifacts/rc/build-manifest.json
            artifacts/rc/SHA256SUMS.txt
            artifacts/rc/evidence/**
          if-no-files-found: error
          retention-days: 30
